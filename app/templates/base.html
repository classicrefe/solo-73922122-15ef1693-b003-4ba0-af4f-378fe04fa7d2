<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}赔款发展三角 · 月结{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1><a href="{{ url_for('main.index') }}">赔款发展三角 · 月结</a></h1>
  <nav>
    <a href="{{ url_for('main.index') }}">首页</a>
    <a href="{{ url_for('main.import_csv') }}">导入赔款</a>
    <a href="{{ url_for('main.close') }}">封账</a>
    <a href="{{ url_for('main.triangle') }}">三角回查</a>
    <a href="{{ url_for('main.setup') }}">待结月设置</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>金额单位：分 · 归档只读汇总，已结三角按当时口径回查</footer>
</body>
</html>
